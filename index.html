<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chronlang Engine Playground</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --error: #f87171;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 1rem 1.5rem;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 { font-size: 1.2rem; font-weight: 600; }
    header span { font-size: 0.85rem; color: var(--muted); }
    .controls {
      display: flex;
      gap: 0.75rem;
      align-items: center;
    }
    select, button {
      padding: 0.5rem 1rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 0.9rem;
      cursor: pointer;
    }
    button.primary {
      background: var(--accent);
      color: #0f172a;
      border: none;
      font-weight: 600;
    }
    button.primary:hover { background: var(--accent-hover); color: #fff; }
    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      padding: 1rem 1.5rem;
      overflow: hidden;
    }
    .pane {
      display: flex;
      flex-direction: column;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    .pane-header {
      padding: 0.65rem 1rem;
      background: rgba(0, 0, 0, 0.2);
      border-bottom: 1px solid var(--border);
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
    }
    textarea, pre {
      flex: 1;
      width: 100%;
      padding: 1rem;
      background: transparent;
      border: none;
      color: var(--text);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.95rem;
      line-height: 1.5;
      resize: none;
      outline: none;
      overflow: auto;
    }
    pre.error { color: var(--error); }
    @media (max-width: 768px) {
      main { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Chronlang Engine</h1>
      <span id="status">Loading engine exports...</span>
    </div>
    <div class="controls">
      <label for="fn-select" style="font-size: 0.85rem; color: var(--muted);">Entry Function:</label>
      <select id="fn-select"></select>
      <button id="run-btn" class="primary">Run Engine (Ctrl+Enter)</button>
    </div>
  </header>

  <main>
    <section class="pane">
      <div class="pane-header">
        <span>CHRONLANG SCRIPT / SOUND CHANGES</span>
        <span id="char-count">0 chars</span>
      </div>
      <textarea id="editor" spellcheck="false" placeholder="Enter your Chronlang rules and lexicon here..."></textarea>
    </section>

    <section class="pane">
      <div class="pane-header">
        <span>ENGINE OUTPUT</span>
        <button id="copy-btn" style="padding: 2px 8px; font-size: 0.75rem;">Copy</button>
      </div>
      <pre id="output">Click "Run Engine" to evaluate your script.</pre>
    </section>
  </main>

  <script type="module" src="/src/ui.ts"></script>
</body>
</html>
